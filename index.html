</style></head><body><div class="app"><header><h1>⌂ Family Hub 2.0</h1><div class="date" id="headDate"></div></header><div class="top"><div class="card"><div class="time" id="clock">--:--</div><div class="sub" id="longDate"></div></div><div class="card"><div class="temp">🌤 22°C</div><div class="weatherline">Partly cloudy</div><div class="sub">Maitland, NSW</div><div class="hint">DEMO WEATHER</div></div></div><section class="card" id="calendar"><h2>▣ Family Calendar</h2><div class="hint">DEMO EVENTS · Google Calendar not connected</div><div class="tabs"><button class="active" data-view="Today">Today</button><button data-view="Week">Week</button><button data-view="Month">Month</button></div><div id="events"></div></section><section class="card meals" id="meals"><h2>♨ Dinner This Week</h2><div id="mealRows"></div><div class="hint">Sample weekly plan · View only</div></section><section class="card forecast" id="weather"><h2>☀ Maitland Forecast</h2><div class="hint">DEMO FORECAST · Live weather not connected</div><div class="days" id="days"></div></section></div><nav class="nav"><button class="active" data-target="top"><span>⌂</span>Home</button><button data-target="calendar"><span>▣</span>Calendar</button><button data-target="meals"><span>♨</span>Meals</button><button data-target="weather"><span>☀</span>Weather</button></nav><script>
(function(){function tick(){var d=new Date();document.getElementById('clock').textContent=d.toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit',hour12:true});document.getElementById('longDate').textContent=d.toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long'});document.getElementById('headDate').textContent=d.toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'});}tick();setInterval(tick,30000);

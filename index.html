</style></head><body><div class="app"><header><h1>⌂ Family Hub 2.0</h1><div class="date" id="headDate"></div><button id="fullScreenButton" type="button" aria-label="Request fullscreen">⛶ Full screen</button></header><div class="top"><div class="card"><div class="time" id="clock">--:--</div><div class="sub" id="longDate"></div></div><div class="card"><div class="temp" id="liveTemp">--°C</div><div class="weatherline" id="liveCondition">Loading weather…</div><div class="sub">Maitland, NSW</div><div class="hint" id="weatherStatus">Connecting to Open-Meteo</div></div></div><section class="card" id="calendar"><h2>▣ Family Calendar</h2><div class="hint">DEMO EVENTS · Google Calendar not connected</div><div class="tabs"><button class="active" data-view="Today">Today</button><button data-view="Week">Week</button><button data-view="Month">Month</button></div><div id="events"></div></section><section class="card meals" id="meals"><h2>♨ Dinner This Week</h2><div id="mealRows"></div><div class="hint">Sample weekly plan · View only</div></section><section class="card forecast" id="weather"><h2>☀ Maitland Forecast</h2><div class="hint" id="forecastStatus">Loading five-day forecast…</div><div class="days" id="days"></div></section></div><nav class="nav"><button class="active" data-target="top"><span>⌂</span>Home</button><button data-target="calendar"><span>▣</span>Calendar</button><button data-target="meals"><span>♨</span>Meals</button><button data-target="weather"><span>☀</span>Weather</button></nav><script>
(function(){function tick(){var d=new Date();document.getElementById('clock').textContent=d.toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit',hour12:true});document.getElementById('longDate').textContent=d.toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long'});document.getElementById('headDate').textContent=d.toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'});}tick();setInterval(tick,30000);
var ev=[['Swimming','Tuesday · 4:00–5:00 pm','#248ae2'],['Choir','Wednesday · 7:50 am','#8451d1'],['Family event','Example calendar item','#27a86b']];function events(v){var el=document.getElementById('events');el.innerHTML='';var data=v==='Today'?ev.slice(0,3):v==='Week'?ev:ev.concat([['Next week','Example event','#e1a13d']]);data.forEach(function(e){var row=document.createElement('div');row.className='event';var dot=document.createElement('span');dot.className='dot';dot.style.background=e[2];var detail=document.createElement('div');var name=document.createElement('strong');name.textContent=e[0];var when=document.createElement('small');when.textContent=e[1];detail.appendChild(name);detail.appendChild(when);row.appendChild(dot);row.appendChild(detail);el.appendChild(row);});}events('Today');Array.prototype.forEach.call(document.querySelectorAll('[data-view]'),function(b){b.onclick=function(){Array.prototype.forEach.call(document.querySelectorAll('[data-view]'),function(x){x.classList.remove('active')});b.classList.add('active');events(b.getAttribute('data-view'));};});
[['Mon','Pesto pasta'],['Tue','Tacos / wraps'],['Wed','Fish & steam vegetables'],['Thu','Butter tofu & rice'],['Fri','Burgers'],['Sat','Stir fry'],['Sun','Spaghetti bolognese']].forEach(function(m){var r=document.createElement('div');r.className='meal';var a=document.createElement('span');a.className='day';a.textContent=m[0];var b=document.createElement('span');b.textContent=m[1];r.appendChild(a);r.appendChild(b);document.getElementById('mealRows').appendChild(r);});Array.prototype.forEach.call(document.querySelectorAll('[data-target]'),function(b){b.onclick=function(){Array.prototype.forEach.call(document.querySelectorAll('[data-target]'),function(x){x.classList.remove('active')});b.classList.add('active');var t=b.getAttribute('data-target');if(t==='top'){window.scrollTo(0,0)}else{document.getElementById(t).scrollIntoView();}};});})();
</script><script>
(function(){
 var button=document.getElementById('fullScreenButton');
 function active(){return !!(document.fullscreenElement||document.webkitFullscreenElement);}
 function sync(){button.textContent=active()?'⛶ Exit full screen':'⛶ Full screen';}
 button.addEventListener('click',function(){
  if(active()){
   var exit=document.exitFullscreen||document.webkitExitFullscreen;
   if(exit){try{var p=exit.call(document);if(p&&p.catch)p.catch(function(){});}catch(e){}}
   return;
  }
  var el=document.documentElement;
  var request=el.requestFullscreen||el.webkitRequestFullscreen||el.webkitRequestFullScreen;
  if(!request){alert('This Samsung browser does not support website full-screen mode. We can still optimise the layout to fit between the browser bars.');return;}
  try{
   var result=request.call(el);
   if(result&&result.catch){result.catch(function(){alert('Samsung blocked the full-screen request. The browser bars may need to stay visible.');});}
  }catch(e){alert('Samsung blocked the full-screen request.');}
 });
 document.addEventListener('fullscreenchange',sync);
 document.addEventListener('webkitfullscreenchange',sync);
})();
</script><script>
(function(){
 var endpoint='https://api.open-meteo.com/v1/forecast?latitude=-32.7331&longitude=151.5574&current=temperature_2m,weather_code,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Australia%2FSydney&forecast_days=5';
 var lastSuccess=0;
 function label(code){
  if(code===0)return ['Clear sky','☀️'];
  if(code===1||code===2)return ['Partly cloudy','🌤️'];
  if(code===3)return ['Cloudy','☁️'];
  if(code===45||code===48)return ['Foggy','🌫️'];
  if(code===51||code===53||code===55||code===56||code===57)return ['Drizzle','🌦️'];
  if(code===61||code===63||code===65||code===66||code===67)return ['Rain','🌧️'];
  if(code===71||code===73||code===75||code===77)return ['Snow','🌨️'];
  if(code===80||code===81||code===82)return ['Showers','🌦️'];
  if(code===85||code===86)return ['Snow showers','🌨️'];
  if(code===95||code===96||code===99)return ['Thunderstorms','⛈️'];
  return ['Conditions unavailable','🌡️'];
 }
 function status(msg){document.getElementById('weatherStatus').textContent=msg;document.getElementById('forecastStatus').textContent=msg;}
 function render(data){
  if(!data||!data.current||!data.daily||!data.daily.time||data.daily.time.length<5)throw new Error('Incomplete weather response');
  var c=data.current;var cond=label(c.weather_code);var icon=cond[1];
  if(c.is_day===0&&c.weather_code===0)icon='🌙';
  document.getElementById('liveTemp').textContent=icon+' '+Math.round(c.temperature_2m)+'°C';
  document.getElementById('liveCondition').textContent=cond[0];
  var days=document.getElementById('days');days.textContent='';
  for(var i=0;i<5;i++){
   var item=document.createElement('div');
   var title=document.createElement('b');
   var date=new Date(data.daily.time[i]+'T12:00:00');
   title.textContent=i===0?'Today':date.toLocaleDateString('en-AU',{weekday:'short'});
   var symbol=document.createElement('span');symbol.textContent=label(data.daily.weather_code[i])[1];
   var range=document.createElement('small');range.textContent=Math.round(data.daily.temperature_2m_max[i])+'°/'+Math.round(data.daily.temperature_2m_min[i])+'°';
   item.appendChild(title);item.appendChild(symbol);item.appendChild(range);days.appendChild(item);
  }
  lastSuccess=Date.now();status('Live forecast · Updated '+new Date().toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit'}));
 }
 function load(){
  var xhr=new XMLHttpRequest();xhr.open('GET',endpoint,true);xhr.timeout=15000;
  xhr.onreadystatechange=function(){if(xhr.readyState!==4)return;
   if(xhr.status>=200&&xhr.status<300){try{render(JSON.parse(xhr.responseText));return;}catch(e){}}
   status(lastSuccess?'Weather temporarily unavailable · Last successful update retained':'Weather unavailable · Check fridge internet connection');
  };
  xhr.onerror=xhr.ontimeout=function(){status(lastSuccess?'Weather temporarily unavailable · Last successful update retained':'Weather unavailable · Check fridge internet connection');};
  try{xhr.send();}catch(e){status('Weather unavailable · Browser connection blocked');}
 }
 load();setInterval(load,15*60*1000);
})();
</script></body></html>
